<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfume - SCNTS Perfume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta name="theme-color" content="#a3134f">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/journey.css">
  <script src="js/fx.js" defer></script>
  <script src="js/api.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <p><a href="shop.html">← Back to shop</a></p><br>
    <div id="detail"><p class="empty">Loading...</p></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      var id = new URLSearchParams(location.search).get("id");
      var box = document.getElementById("detail");
      if (!id) { box.innerHTML = '<p class="empty">No perfume selected.</p>'; return; }
      try {
        var p = await api(shopPath("/products/" + encodeURIComponent(id)));
        document.title = p.name + " - SCNTS Perfume";
        box.innerHTML = '<div class="pdp-bg" style="background-image:url(\'' + esc(p.image_url || "") + '\')"></div><div class="detail pdp">' + productImage(p) + "<div>" +
          '<span class="brand">' + esc(p.brand) + " · " + categoryLabel(p.category) + "</span>" +
          "<h1>" + esc(p.name) + "</h1>" +
          '<p class="price" style="font-size:1.6rem">' + money(p.price) + "</p>" +
          '<p class="tag">' + esc(p.size_ml) + " ml · " + (p.stock > 0 ? p.stock + " in stock" : "Out of stock") + "</p><br>" +
          "<p>" + esc(p.description || "") + "</p><br>" +
          '<div class="qty"><button id="minus">−</button><input id="qty" type="number" min="1" max="20" value="1"><button id="plus">+</button></div> ' +
          '<button class="btn" id="add"' + (p.stock <= 0 ? " disabled" : "") + ">Add to cart</button>" +
          "</div></div>";
        var pi = box.querySelector(".pimg");
        if (pi && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.addEventListener("pointermove", function (e) {
            var x = (e.clientX / innerWidth - .5) * 2, y = (e.clientY / innerHeight - .5) * 2;
            pi.style.transform = "perspective(1100px) rotateY(" + x * 9 + "deg) rotateX(" + (-y * 7) + "deg)";
          });
        }
        var qty = document.getElementById("qty");
        document.getElementById("minus").onclick = function () { qty.value = Math.max(1, Number(qty.value) - 1); };
        document.getElementById("plus").onclick = function () { qty.value = Math.min(20, Number(qty.value) + 1); };
        document.getElementById("add").onclick = function () {
          var n = Math.min(20, Math.max(1, parseInt(qty.value, 10) || 1));
          addToCart(p, n);
        };
      } catch (err) {
        box.innerHTML = '<p class="empty">' + esc(err.message) + "</p>";
      }
    });
  </script>
</body>
</html>
