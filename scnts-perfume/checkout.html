<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - SCNTS Perfume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/api.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <h1 class="page-title">Checkout</h1>
    <div class="box" id="checkout-box">
      <div id="summary"></div>
      <div id="msg" class="msg"></div>
      <div class="total-line" id="total-line"><span>Total</span><strong id="total" class="price"></strong></div>
      <button class="btn" id="place-btn">Place order</button>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
