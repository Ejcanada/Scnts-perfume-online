<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products - SCNTS Perfume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta name="theme-color" content="#a3134f">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/fx.js" defer></script>
  <script src="js/api.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <h1 class="page-title">Products</h1>
    <p class="sub">Add, edit or remove perfumes. Customer orders are on the Orders page.</p>

    <div id="not-admin" style="display:none">
      <div class="box"><p>Admins only. Your account does not have admin access.</p></div>
    </div>

    <div id="admin-content">
      <div id="msg" class="msg"></div>

      <div class="box">
        <h2 id="form-title">Add a perfume</h2>
        <form id="product-form">
          <div class="form-grid">
            <div><label for="f-name">Name</label><input id="f-name" required maxlength="150"></div>
            <div><label for="f-brand">Brand</label><input id="f-brand" required maxlength="100"></div>
            <div><label for="f-price">Price (₱)</label><input id="f-price" type="number" min="0" step="0.01" required></div>
            <div><label for="f-size">Size (ml)</label><input id="f-size" type="number" min="1" required></div>
            <div><label for="f-category">Category</label>
              <select id="f-category" required>
                <option value="men">For him (men)</option>
                <option value="women">For her (women)</option>
              </select></div>
            <div><label for="f-company">Company price (₱) - fixed price for resellers</label><input id="f-company" type="number" min="0" step="0.01" value="250"></div>
            <div><label for="f-stock">Stock</label><input id="f-stock" type="number" min="0" value="0"></div>
          </div>
          <label for="f-image">Image path or link (example: images/products/rose.jpg)</label>
          <input id="f-image" maxlength="500">
          <label for="f-description">Description</label>
          <textarea id="f-description" rows="3" maxlength="2000"></textarea>
          <br>
          <button class="btn" id="save-btn" type="submit">Add perfume</button>
          <button class="btn btn-outline" id="cancel-btn" type="button" style="display:none">Cancel</button>
        </form>
      </div>

      <div class="box">
        <h2>Perfumes</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Name</th><th>Brand</th><th>Category</th><th>Price</th><th>Company price</th><th>Stock</th><th></th></tr></thead>
            <tbody id="product-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
