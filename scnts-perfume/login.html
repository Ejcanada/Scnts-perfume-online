<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SCNTS Perfume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta name="theme-color" content="#a3134f">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/fx.js" defer></script>
  <script src="js/api.js"></script>
</head>
<body data-layout="none">
  <div class="login-wrap">
    <div class="login-box">
      <div class="logo">SCNTS</div>
      <p class="sub" style="text-align:center">Please log in to continue.</p>

      <div class="tabs">
        <button id="tab-login" class="active" type="button">Login</button>
        <button id="tab-register" type="button">Create account</button>
      </div>

      <div id="msg" class="msg"></div>

      <form id="login-form">
        <label for="l-email">Email</label>
        <input id="l-email" type="email" autocomplete="email" required>
        <label for="l-password">Password</label>
        <input id="l-password" type="password" autocomplete="current-password" required>
        <br><br>
        <button class="btn" style="width:100%" type="submit">Login</button>
      </form>

      <form id="register-form" style="display:none">
        <label for="r-name">Full name</label>
        <input id="r-name" type="text" autocomplete="name" required>
        <label for="r-email">Email</label>
        <input id="r-email" type="email" autocomplete="email" required>
        <label for="r-password">Password (at least 6 characters)</label>
        <input id="r-password" type="password" autocomplete="new-password" required>
        <br><br>
        <button class="btn" style="width:100%" type="submit">Create account</button>
      </form>

      <p style="text-align:center;margin-top:16px"><a href="index.html">← Continue browsing</a></p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // After login go back to the page the user wanted (only our own .html pages)
    function nextPage() {
      var n = new URLSearchParams(location.search).get("next");
      if (n && /^[A-Za-z0-9_\-]+\.html(\?[A-Za-z0-9_=&%.\-]*)?$/.test(n)) return n;
      var u = getUser();
      return (u && (u.role === "admin" || u.role === "employee")) ? "dashboard.html" : "index.html";
    }

    // Already logged in? Go on.
    if (getToken()) location.replace(nextPage());

    if (new URLSearchParams(location.search).get("msg") === "login") {
      showMsg("msg", "Please log in or create an account to continue.", "info");
    }

    function showTab(which) {
      var isLogin = which === "login";
      document.getElementById("login-form").style.display = isLogin ? "block" : "none";
      document.getElementById("register-form").style.display = isLogin ? "none" : "block";
      document.getElementById("tab-login").className = isLogin ? "active" : "";
      document.getElementById("tab-register").className = isLogin ? "" : "active";
      hideMsg("msg");
    }
    document.getElementById("tab-login").onclick = function () { showTab("login"); };
    document.getElementById("tab-register").onclick = function () { showTab("register"); };

    async function doLogin(email, password) {
      var data = await api("/auth/login", "POST", { email: email, password: password });
      localStorage.setItem("scnts_token", data.access_token);
      localStorage.setItem("scnts_user", JSON.stringify(data.user));
      location.href = nextPage();
    }

    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      hideMsg("msg");
      try {
        await doLogin(document.getElementById("l-email").value.trim(), document.getElementById("l-password").value);
      } catch (err) {
        showMsg("msg", err.message, "error");
      }
    });

    document.getElementById("register-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      hideMsg("msg");
      var email = document.getElementById("r-email").value.trim();
      var password = document.getElementById("r-password").value;
      try {
        await api("/auth/register", "POST", {
          name: document.getElementById("r-name").value.trim(),
          email: email,
          password: password
        });
        await doLogin(email, password);
      } catch (err) {
        showMsg("msg", err.message, "error");
      }
    });
  </script>
</body>
</html>
