<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff - SCNTS Perfume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta name="theme-color" content="#a3134f">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/staff.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/shell.css">
  <script src="js/fx.js" defer></script>
  <script src="js/api.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div id="denied" style="display:none"><div class="box"><p>Admin only. Your account does not have access to this page.</p></div></div>
    <div id="staff-content" style="display:none">
      <h1 class="page-title">Staff</h1>
      <p class="sub">Create accounts for your employees. They can sell and see stock, but they cannot change stock or delete sales.</p>
      <div id="msg" class="msg"></div>

      <div class="box">
        <h2>Add an employee</h2>
        <form id="staff-form" class="inline-form">
          <div><label for="s-name">Full name</label><input id="s-name" required maxlength="100"></div>
          <div><label for="s-email">Email (used to log in)</label><input id="s-email" type="email" required></div>
          <div><label for="s-pass">Password (at least 6)</label><input id="s-pass" type="text" required minlength="6" maxlength="72"></div>
          <div style="flex:0 0 auto"><button class="btn" type="submit">Add employee</button></div>
        </form>
      </div>

      <div class="box">
        <h2>Your team</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
            <tbody id="staff-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
