<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders - SCNTS Perfume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta name="theme-color" content="#a3134f">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/staff.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/pay.css">
  <link rel="stylesheet" href="css/shell.css">
  <script src="js/fx.js" defer></script>
  <script src="js/api.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div id="denied" style="display:none"><div class="box"><p>Admin only. Your account does not have access to this page.</p></div></div>
    <div id="staff-content" style="display:none">
      <h1 class="page-title">Customer orders</h1>
      <p class="sub">Orders that customers placed on the website. Walk-in sales are in POS and Sales.</p>
      <div id="msg" class="msg"></div>

      <div class="cards" id="order-cards"></div>

      <div class="date-bar">
        <div class="chips" id="status-chips" style="margin:0"></div>
        <input id="search" type="search" placeholder="Search order #, name or email..." style="flex:1 1 240px">
      </div>

      <div id="order-list"><p class="empty">Loading...</p></div>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script src="js/pay.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
