<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My orders - SCNTS Perfume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/api.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <h1 class="page-title">My orders</h1>
    <p class="sub">Only you can see these.</p>
    <div id="orders"><p class="empty">Loading...</p></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      var box = document.getElementById("orders");
      try {
        var data = await api("/orders");
        if (!data.orders.length) {
          box.innerHTML = '<p class="empty">No orders yet. <a href="shop.html">Start shopping</a></p>';
          return;
        }
        box.innerHTML = data.orders.map(function (o) {
          var items = o.order_items.map(function (i) {
            var name = i.product ? i.product.name : "Perfume " + i.product_id;
            return "<tr><td>" + esc(name) + "</td><td>" + i.quantity + "</td><td>" + money(i.price) + "</td></tr>";
          }).join("");
          return '<div class="box"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">' +
            "<strong>Order #" + o.id + "</strong>" +
            '<span class="status">' + esc(o.status) + "</span></div>" +
            '<p class="sub">' + new Date(o.created_at).toLocaleString() + "</p>" +
            '<div class="table-wrap"><table><tr><th>Perfume</th><th>Qty</th><th>Price</th></tr>' + items + "</table></div>" +
            '<div class="total-line"><span>Total</span><strong class="price">' + money(o.total) + "</strong></div></div>";
        }).join("");
      } catch (err) {
        box.innerHTML = '<p class="empty">' + esc(err.message) + "</p>";
      }
    });
  </script>
</body>
</html>
