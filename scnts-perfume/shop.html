<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop - SCNTS Perfume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta name="theme-color" content="#a3134f">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/fx.js" defer></script>
  <script src="js/api.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div id="shop-banner"></div>
    <h1 class="page-title">Shop</h1>
    <p class="sub">Search by name or brand, or pick a category.</p>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search perfumes...">
      <select id="category">
        <option value="">All categories</option>
        <option value="men">For him</option>
        <option value="women">For her</option>
        <option value="unisex">Unisex</option>
      </select>
    </div>

    <div id="grid" class="grid"></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var c = new URLSearchParams(location.search).get("category");
      if (c) document.getElementById("category").value = c;   // links from the home page
      startShop();
    });
  </script>
</body>
</html>
