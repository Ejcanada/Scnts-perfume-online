<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop - SCNTS Perfume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta name="theme-color" content="#a3134f">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/journey.css">
  <link rel="stylesheet" href="css/shop.css">
  <script src="js/fx.js" defer></script>
  <script src="js/api.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="container shop-main">
    <div id="shop-banner"></div>
    <section class="shop-hero">
      <div class="sh-copy">
        <p class="sh-k">The collection</p>
        <h1 class="page-title">Find your <em>signature</em> scent</h1>
        <p class="sh-sub">Rich eau de perfume for him, for her and for everyone. Pick a poster to step inside.</p>
        <div class="sh-stats"><span><b id="hero-count">&ndash;</b> fragrances</span><span><b>60</b> ml</span><span><b>2</b> collections</span></div>
        <button class="btn sh-guide" type="button" id="open-guide">Find your fragrance</button>
      </div>
      <div class="sh-fan" aria-hidden="true">
        <img src="images/products/cherry-red.jpg" alt=""><img src="images/products/dior-sauvage.jpg" alt=""><img src="images/products/versace-eros.jpg" alt="">
        <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
      </div>
    </section>
    <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker-track"><span>Eau de perfume</span><em>&#10022;</em><span>For him</span><em>&#10022;</em><span>For her</span><em>&#10022;</em></div></div>

    <div class="shop-bar" id="shop-bar">
      <div class="chips" role="group" aria-label="Category">
        <button type="button" class="chip" data-cat="">All</button>
        <button type="button" class="chip" data-cat="men">For him</button>
        <button type="button" class="chip" data-cat="women">For her</button>
      </div>
      <div class="bar-tools">
        <label class="sr-search"><span class="sr-only">Search perfumes</span><input id="search" type="search" placeholder="Search a scent"></label>
        <label><span class="sr-only">Sort</span><select id="sort"><option value="">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="az">Name: A to Z</option></select></label>
        <select id="category" hidden aria-hidden="true"><option value="">All categories</option><option value="men">For him</option><option value="women">For her</option></select>
      </div>
    </div>
    <p class="result-count" id="count" aria-live="polite"></p>

    <div id="grid" class="grid shopgrid"></div>

    <section class="guide-band">
      <h2>Not sure where to start?</h2>
      <p>Answer two quick questions and we will pick the perfumes that fit.</p>
      <button class="btn" type="button" data-guide>Find your fragrance</button>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/journey.js"></script>
  <script src="js/guide.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var c = new URLSearchParams(location.search).get("category");
      if (c) document.getElementById("category").value = c;
      document.getElementById("open-guide").addEventListener("click", function (e) { Guide.open(e); });   // links from the home page
      startShop();
    });
  </script>
</body>
</html>
